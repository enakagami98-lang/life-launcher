name: 仮想スマホで動作確認

on:
  workflow_dispatch:
    inputs:
      only:
        description: "all=全部 / scroll=スクロールだけ / simple=簡易モードと長押しパネル / condition=お気に入りの並べ替えと今日の調子 / tasks=今日のタスク・使用時間・今何してる？ / top=トップ画面と支払額 / lang=いろいろな言語の表示 / count=制限アプリの使用時間 / goal=朝の今日の目標 / tutorial=使い方 / paywall=Play版の購入画面（all以外はAndroid 15のみ）"
        default: "all"
      tag:
        description: "試すAPKのリリース名（空なら最新）"
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.only == 'all' && '[34, 35]' || '[35]') }}
    steps:
      - uses: actions/checkout@v4
      - name: 最新のAPKを取得
        run: gh release download ${{ inputs.tag }} --pattern LifeLauncher.apk --pattern Loosen-play.apk
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install pillow
      - name: KVMを有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/e2e/${{ inputs.only == 'all' && 'e2e' || inputs.only }}.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out-${{ matrix.api }}
          path: e2e-out
