name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 署名用の鍵を復元
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: APKを組み立てる
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}

      - name: リリースに公開
        run: |
          cp app/build/outputs/apk/release/app-release.apk LifeLauncher.apk
          gh release create "v1.0.${{ github.run_number }}" LifeLauncher.apk \
            --title "LifeLauncher 1.0.${{ github.run_number }}" \
            --notes "$NOTES" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
