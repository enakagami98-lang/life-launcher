name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 署名用の鍵を復元
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: APKを組み立てる
        run: gradle assembleGithubRelease assemblePlayRelease bundlePlayRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          # Google Play の署名鍵の指紋（Play Console で確認してリポジトリの変数に登録する。秘密ではない）
          PLAY_CERT_SHA256: ${{ vars.PLAY_CERT_SHA256 }}

      - name: リリースに公開
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk LifeLauncher.apk
          # Google Play 用：AAB は Play Console にアップロードするもの、APK は仮想スマホでの確認用
          cp app/build/outputs/bundle/playRelease/app-play-release.aab Loosen-play.aab
          cp app/build/outputs/apk/play/release/app-play-release.apk Loosen-play.apk
          gh release create "v1.0.${{ github.run_number }}" LifeLauncher.apk Loosen-play.aab Loosen-play.apk \
            --title "LifeLauncher 1.0.${{ github.run_number }}" \
            --notes "$NOTES" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
